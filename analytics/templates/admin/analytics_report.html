{% load static %}
<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Mahmood Pharmacy Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981', // Emerald
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: #0f172a;
        }
        
        .dark body {
            background-color: #0f172a; /* Deep Slate */
            background-image: radial-gradient(at 0% 0%, rgba(6, 78, 59, 0.3) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(30, 58, 138, 0.2) 0px, transparent 50%);
            color: #f1f5f9;
        }
        
        /* Glass Effect */
        .glass-effect {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        .dark .glass-effect {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        
        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #059669 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .dark .gradient-text {
            background: linear-gradient(135deg, #34d399 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        .animate-slide-in { animation: slideIn 0.5s ease-out forwards; }
        
        /* Button Styles */
        .btn-gradient {
            background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
            transition: all 0.3s ease;
        }
        
        .btn-gradient:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
        }
        
        .dark .btn-gradient {
            background: linear-gradient(135deg, #059669 0%, #2563eb 100%);
        }
        
        .dark .btn-gradient:hover {
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        /* Chart Decorator Line */
        .chart-container { position: relative; overflow: hidden; }
        .chart-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #10b981, #3b82f6, #10b981);
            background-size: 200% 100%;
            animation: shimmer 4s linear infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* STOPPED ANIMATION HERE */
        .floating-icon { 
            /* animation: float 4s ease-in-out infinite; */ 
            /* Animation removed as requested */
        }

        .nav-link { position: relative; transition: color 0.2s ease; }
        .nav-link::after {
            content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px;
            background: #10b981; transition: width 0.3s ease;
        }
        .nav-link:hover::after { width: 100%; }
    </style>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="min-h-screen transition-colors duration-500">

    <nav class="sticky top-0 z-50 glass-effect border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 sm:h-20 items-center">
                <div class="flex items-center gap-2 sm:gap-4 animate-slide-in">
                    <div class="floating-icon">
                        <img src="{% static 'img/app_logo.png' %}" alt="Logo" class="h-8 sm:h-12 w-auto">
                    </div>
                    <div>
                        <a href="{% url 'admin-charts' %}" class="text-lg sm:text-2xl font-bold text-slate-800 dark:text-white leading-tight block tracking-tight">
                            Mahmood <span class="text-brand-600 dark:text-brand-400">Pharmacy</span>
                        </a>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium hidden sm:block tracking-wide">Advanced Analytics Platform</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3 sm:gap-6">
                    <a href="{% url 'admin-charts' %}" class="nav-link text-sm font-semibold text-slate-600 hover:text-brand-600 transition-colors dark:text-slate-300 dark:hover:text-brand-400 flex items-center p-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 sm:hover:bg-transparent sm:p-0">
                        <i class="fa-solid fa-arrow-left sm:mr-2"></i> <span class="hidden sm:inline">Dashboard</span>
                    </a>
                    
                    <button id="theme-toggle" class="p-2 sm:p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-brand-500" title="Toggle Dark Mode">
                        <i id="theme-toggle-dark-icon" class="hidden fa-solid fa-moon text-slate-500 dark:text-slate-400"></i>
                        <i id="theme-toggle-light-icon" class="hidden fa-solid fa-sun text-amber-500"></i>
                    </button>
                    
                    <div class="hidden sm:flex items-center gap-4 border-l border-slate-200 pl-6 dark:border-slate-700">
                        <div class="text-right">
                            <p class="text-sm font-bold text-slate-800 dark:text-slate-100">Admin User</p>
                            <p class="text-xs text-slate-500 dark:text-slate-400">
                                <i class="fa-solid fa-circle text-emerald-500 text-[10px] mr-1"></i> Online
                            </p>
                        </div>
                        <div class="h-10 w-10 rounded-full bg-slate-200 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 flex items-center justify-center text-slate-600 dark:text-slate-300 font-bold text-lg">A</div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
        
        <div class="glass-effect rounded-2xl p-5 sm:p-8 mb-6 sm:mb-8 animate-fade-in-up">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-5 sm:gap-6">
                <div class="flex-1 w-full">
                    <div class="flex flex-row items-center gap-4 mb-2">
                        <div class="h-12 w-12 rounded-xl bg-brand-50 dark:bg-brand-900/30 flex items-center justify-center border border-brand-100 dark:border-brand-800 flex-shrink-0">
                            <i class="fa-solid fa-chart-line text-brand-600 dark:text-brand-400 text-xl"></i>
                        </div>
                        <div>
                            <h1 class="text-xl sm:text-3xl font-bold text-slate-900 dark:text-white break-all tracking-tight">{{ title }}</h1>
                        </div>
                    </div>
                     <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium ml-1">
                        <i class="fa-regular fa-calendar text-slate-400 mr-2"></i>Real-time performance insights & analytics
                    </p>
                </div>

                <div class="flex items-center gap-4 w-full md:w-auto">
                    <div class="bg-white/50 dark:bg-slate-800/50 p-2 sm:p-3 rounded-xl border border-slate-200 dark:border-slate-700 w-full md:w-auto hover:border-brand-500 transition-colors">
                        <label for="branchFilter" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1 uppercase tracking-wider pl-1">
                            <i class="fa-solid fa-filter mr-1"></i> Filter Branch
                        </label>
                        <select id="branchFilter" onchange="applyFilter()" class="cursor-pointer bg-transparent text-slate-800 dark:text-white text-sm rounded-lg border-0 focus:ring-0 block w-full py-1.5 pl-1 pr-8 font-semibold">
                            <option value="all" {% if selected_branch == 'all' %}selected{% endif %}>🌐 All Branches</option>
                            {% for branch in branches %}
                                <option value="{{ branch.id }}" {% if selected_branch == branch.id %}selected{% endif %}>📍 {{ branch.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-effect rounded-2xl overflow-hidden animate-fade-in-up border border-slate-200 dark:border-slate-700" style="animation-delay: 0.1s;">
            <div class="chart-container">
                <div class="p-4 sm:p-6 md:p-8">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 sm:mb-8 gap-4">
                        <div>
                            <h2 class="text-lg sm:text-xl font-bold text-slate-800 dark:text-white mb-1">Visual Analysis</h2>
                            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">Interactive data visualization representation</p>
                        </div>
                        <button onclick="downloadChart()" class="btn-gradient text-white px-5 py-3 rounded-lg text-sm font-semibold shadow-md flex items-center gap-2 transition-transform hover:scale-105 active:scale-95 w-full sm:w-auto justify-center">
                            <i class="fa-solid fa-download"></i> Export Graph
                        </button>
                    </div>
                    
                    <div class="relative w-full bg-white dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-700/50 p-2 sm:p-4 h-[400px] sm:h-[450px]">
                        <canvas id="reportChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <script>
        // Dark Mode Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        function setChartTheme(isDark) {
            const color = isDark ? '#94a3b8' : '#64748b'; 
            const gridColor = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';
            
            Chart.defaults.color = color;
            Chart.defaults.scale.grid.color = gridColor;
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.font.size = 12;
            
            const chartInstance = Chart.getChart("reportChart");
            if (chartInstance) {
                chartInstance.update();
            }
        }

        if (document.documentElement.classList.contains('dark')) {
            themeToggleLightIcon.classList.remove('hidden');
            setChartTheme(true);
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
            setChartTheme(false);
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
                setChartTheme(false);
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
                setChartTheme(true);
            }
        });

        // Chart Logic
        const reportData = {{ data|safe }};
        const reportType = "{{ report_type }}";
        const chartType = "{{ chart_type }}";
        
        const ctx = document.getElementById('reportChart').getContext('2d');
        let chartConfig = {};

        function generateGradient(ctx, color1, color2) {
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, color1);
            gradient.addColorStop(1, color2);
            return gradient;
        }

        function generateColors(count) {
            const colors = [
                ['#0ea5e9', '#0284c7'],  // Sky Blue
                ['#10b981', '#059669'],  // Emerald Green
                ['#6366f1', '#4f46e5'],  // Indigo
                ['#8b5cf6', '#7c3aed'],  // Violet
                ['#f59e0b', '#d97706'],  // Amber
                ['#ec4899', '#db2777'],  // Pink
                ['#14b8a6', '#0d9488'],  // Teal
                ['#f43f5e', '#e11d48'],  // Rose
                ['#64748b', '#475569'],  // Slate
                ['#84cc16', '#65a30d']   // Lime
            ];
            return colors.slice(0, count).map(([c1, c2]) => {
                const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                gradient.addColorStop(0, c1);
                gradient.addColorStop(1, c2);
                return gradient;
            });
        }
        
        function calculatePercentages(data) {
            const total = data.reduce((sum, item) => sum + item, 0);
            return data.map(value => ((value / total) * 100).toFixed(1));
        }

        if (reportType === 'daily_sales') {
            const labels = reportData.map(d => d.day);
            const values = reportData.map(d => d.total);
            const gradient = generateGradient(ctx, 'rgba(16, 185, 129, 0.25)', 'rgba(16, 185, 129, 0.01)');
            
            chartConfig = {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Daily Sales Revenue',
                        data: values,
                        borderColor: '#10b981',
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#10b981',
                        borderWidth: 2
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: { 
                        y: { beginAtZero: true, grid: { drawBorder: false, borderDash: [5, 5] } },
                        x: { grid: { display: false } }
                    } 
                }
            };
        } else if (reportType === 'monthly_sales') {
            const labels = reportData.map(d => d.period);
            const values = reportData.map(d => d.total);
            // CHANGED: Using gradient for Monthly Sales too, just like Daily Sales
            const gradient = generateGradient(ctx, 'rgba(16, 185, 129, 0.25)', 'rgba(16, 185, 129, 0.01)');
            
            chartConfig = {
                type: 'line', // CHANGED from 'bar' to 'line'
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Monthly Sales Revenue',
                        data: values,
                        borderColor: '#10b981', // Emerald theme like daily
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#10b981',
                        borderWidth: 2
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: true },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: { 
                        y: { beginAtZero: true, grid: { drawBorder: false, borderDash: [5, 5] } },
                        x: { grid: { display: false } }
                    } 
                }
            };
        } else {
            let labels = [];
            let values = [];
            let labelText = "Count";

            if (Array.isArray(reportData) && reportData.length > 0) {
                 if (reportType === 'top_customers') {
                      labels = reportData.map(d => d.email);
                      values = reportData.map(d => d.total_spent);
                      labelText = "Total Spent";
                  } else if (reportType === 'top_products' || reportType === 'top_categories') {
                      const filteredData = reportData.filter(d => d.name && d.name !== 'null');
                      labels = filteredData.map(d => d.name);
                      values = filteredData.map(d => d.count);
                      labelText = "Units Sold";
                  } else if (reportType === 'branch_sales') {
                      labels = reportData.map(d => d.branch__name);
                      values = reportData.map(d => d.count);
                      labelText = "Orders";
                  } else if (reportType === 'order_status') {
                      labels = reportData.map(d => d.status);
                      values = reportData.map(d => d.count);
                      labelText = "Orders";
                  }
            }
            
            const percentages = calculatePercentages(values);
            const isMobile = window.innerWidth < 768;
            
            const isHorizontal = (reportType === 'top_products' || reportType === 'top_customers' || reportType === 'branch_sales');
            
            chartConfig = {
                type: chartType,
                data: {
                    labels: labels,
                    datasets: [{
                        label: labelText,
                        data: values,
                        backgroundColor: generateColors(values.length),
                        borderColor: document.documentElement.classList.contains('dark') ? '#1e293b' : '#ffffff',
                        borderWidth: 2,
                        borderRadius: 4
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    indexAxis: isHorizontal ? 'y' : 'x',
                    layout: { padding: { top: 10, bottom: 10 } },
                    plugins: {
                        legend: {
                            display: chartType === 'pie' || chartType === 'doughnut',
                            position: isMobile ? 'bottom' : 'right',
                            labels: {
                                font: { size: 11, weight: '600' },
                                padding: 15,
                                usePointStyle: true,
                                boxWidth: 8,
                                color: '#0ea5e9', 
                                generateLabels: function(chart) {
                                    const data = chart.data;
                                    if (data.labels.length && data.datasets.length) {
                                        return data.labels.map((label, i) => {
                                            const percentage = percentages[i];
                                            return {
                                                text: `${label} (${percentage}%)`,
                                                fillStyle: data.datasets[0].backgroundColor[i],
                                                fontColor: '#0ea5e9', 
                                                hidden: false,
                                                index: i
                                            };
                                        });
                                    }
                                    return [];
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.95)',
                            padding: 14,
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.parsed.x !== undefined ? context.parsed.x : context.parsed;
                                    const percentage = percentages[context.dataIndex];
                                    return ` ${label}: ${value} (${percentage}%)`;
                                }
                            }
                        },
                        datalabels: chartType === 'pie' || chartType === 'doughnut' ? {
                            color: '#fff',
                            font: { size: 11, weight: 'bold' },
                            formatter: (value, context) => {
                                const pct = parseFloat(percentages[context.dataIndex]);
                                return pct > 5 ? Math.round(pct) + '%' : '';
                            }
                        } : false
                    },
                    scales: chartType !== 'pie' && chartType !== 'doughnut' ? {
                        [isHorizontal ? 'x' : 'y']: { 
                            beginAtZero: true, 
                            grid: { drawBorder: false, borderDash: [4, 4] },
                            ticks: { padding: 10, font: {size: 11} }
                        },
                        [isHorizontal ? 'y' : 'x']: { 
                            grid: { display: false }, 
                            ticks: { padding: 10, font: {size: 11} } 
                        }
                    } : {}
                }
            };
        }

        new Chart(ctx, chartConfig);

        function applyFilter() {
            const branchId = document.getElementById('branchFilter').value;
            const url = new URL(window.location.href);
            url.searchParams.set('branch', branchId);
            window.location.href = url.toString();
        }

        function downloadChart() {
            const link = document.createElement('a');
            link.download = `report_${reportType}.png`;
            link.href = document.getElementById('reportChart').toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
